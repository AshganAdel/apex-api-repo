name: ci

on: 
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docker-compose.yml'
      - '.env.example'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: apexdb
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/apexdb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint
        run: |
          python -m pip install ruff
          ruff check . --ignore B008
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Dependency Scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -f json -o safety-report.json
      
      - name: Set Python path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      
      - name: Test
        run: pytest -v --junitxml=test-results.xml

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/apex-api:${{ github.run_number }} .

      - name: Image Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/apex-api:${{ github.run_number }}
          format: json
          output: trivy-image-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            safety-report.json
            test-results.xml
            trivy-image-report.json    
          retention-days: 30

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/apex-api:${{ github.run_number }}
  

name: ci

on: 
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          python -m pip install ruff
        
      - name: Lint
        run: ruff check . --fix
      
      - name: Test
        run: |
          pytest -v
  
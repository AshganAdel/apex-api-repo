apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: postgres-secret

spec:
  provider: aws

  parameters:
    region: eu-north-1

    usePodIdentity: "true"

    objects: |
      - objectName: "arn:aws:secretsmanager:eu-north-1:887793660251:secret:rds!db-2085e5fc-8773-4a59-b8e0-5bfdbb651f81-SCE09G"
        objectType: "secretsmanager"

        jmesPath:
          - path: username
            objectAlias: username

          - path: password
            objectAlias: password


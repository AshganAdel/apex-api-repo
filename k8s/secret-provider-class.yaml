apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass

metadata:
  name: postgres-secret

spec:
  provider: aws

  parameters:
    region: eu-north-1

    usePodIdentity: "true"

    objects: |
      - objectName: "rds!db-9d925d5f-712f-4c97-b7c0-103fd2759c26"
        objectType: "secretsmanager"

        jmesPath:
          - path: username
            objectAlias: username

          - path: password
            objectAlias: password


apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: apex-api-monitor
  namespace: monitoring

  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: apex-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
